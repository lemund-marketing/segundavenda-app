<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Segunda Venda</title>
  <!-- Mostrada pelo app quando o site não abre: sem internet ou o servidor
       respondeu erro (errorPath no capacitor.config.json). Fica dentro do APK. -->
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #fff; color: #1f2937; padding: 24px; box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    main { max-width: 320px; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 20px; margin: 20px 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #4b5563; margin: 0 0 24px; }
    button {
      width: 100%; padding: 14px; border: 0; border-radius: 10px;
      background: #09AF68; color: #fff; font-size: 16px; font-weight: 600;
    }
    button:active { background: #078a52; }
  </style>
</head>
<body>
  <main>
    <img src="logo.svg" alt="" />
    <h1>Não foi possível abrir o Segunda Venda</h1>
    <p>Confira se o celular está com internet e tente de novo.</p>
    <button id="tentar" type="button">Tentar de novo</button>
  </main>
  <script>
    function tentar() { location.replace("https://app.segundavenda.com.br/"); }
    document.getElementById("tentar").addEventListener("click", tentar);
    // Voltou a internet: tenta sozinho. Sem repetição automática além disso,
    // senão um erro do servidor viraria um laço de recarregar.
    window.addEventListener("online", tentar);
  </script>
</body>
</html>
